<!DOCTYPE html>
<!-- Orbit's newsletter kit for hand-written HTML, written by Orbit's maintainers. Copy it to out/email.html, then
     replace {{preview}} and {{heading}}, and the BODY comment with the issue's content, styled as the examples below.
     Keep the header (id="brand-header") and the footer (id="brand-footer") as they are. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Orbit Dispatch</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f2f6;">
<div style="display: none; max-height: 0; overflow: hidden; font-size: 1px; line-height: 1px; color: #f1f2f6; opacity: 0;">{{preview}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f1f2f6;">
<tr><td align="center" style="padding: 24px 0;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; background-color: #ffffff;">
<tr><td id="brand-header" style="padding: 24px 32px 8px;"><img src="https://assets.orbit.dev/img/orbit-logo.png" width="126" height="64" alt="Orbit" style="display: block; border: 0;"></td></tr>
<tr><td style="padding: 8px 32px;"><h1 style="margin: 0; color: #1f2937; font-family: Helvetica, Arial, sans-serif; font-size: 28px; line-height: 36px;">{{heading}}</h1></td></tr>
<tr><td style="padding: 8px 32px 24px;">
<!-- BODY: a paragraph is <p style="margin: 0 0 12px; color: #1f2937; font-family: Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px;">…</p>;
     a story title <h2 style="margin: 16px 0 8px; color: #1f2937; font-family: Helvetica, Arial, sans-serif; font-size: 20px; line-height: 28px;">…</h2>;
     an image <img src="…" width="536" alt="…" style="display: block; width: 100%; max-width: 536px; height: auto; margin: 8px 0; border: 0;">;
     a button <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 16px;"><tr><td style="background-color: #4f46e5; border-radius: 6px;"><a href="…" style="display: inline-block; padding: 12px 20px; color: #ffffff; font-family: Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px; text-decoration: none;">…</a></td></tr></table> -->
</td></tr>
</table>
<table role="presentation" id="brand-footer" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px;">
<tr><td style="padding: 24px 32px; color: #6b7280; font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 20px;">Orbit Labs, 500 Market St, San Francisco. <a href="https://orbit.dev/unsubscribe?utm_source=newsletter" style="color: #6b7280;">Unsubscribe</a></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
