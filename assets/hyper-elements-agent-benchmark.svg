  <text x="72" y="184" font-size="72" fill="#ededed" font-weight="600" letter-spacing="-2.8">Faster to a passing email.</text>
  <text x="72" y="234" font-size="28" fill="#a1a1a1" >Four approaches. Same briefs. Same checks.</text>
