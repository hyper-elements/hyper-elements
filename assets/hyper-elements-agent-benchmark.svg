  <text x="930" y="330" font-size="27" fill="#ededed" >fewer output tokens</text>
  <text x="930" y="365" font-size="22" fill="#a1a1a1" >vs. React Email</text>

  <text x="1360" y="272" font-size="88" fill="#7ee2a8" font-weight="600" letter-spacing="-4">16/16</text>
  <text x="1360" y="330" font-size="27" fill="#ededed" >passed on first check</text>
  <text x="1360" y="365" font-size="22" fill="#a1a1a1" >tied with MJML</text>

