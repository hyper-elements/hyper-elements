  <text x="72" y="104" font-size="72" fill="#ededed" font-weight="600" letter-spacing="-2.8">Faster to a passing email.</text>
  <text x="72" y="154" font-size="28" fill="#a1a1a1" >Four approaches. Same briefs. Same checks.</text>
  <path d="M72 193H1728" stroke="#272727"/>

  <text x="80" y="265" font-size="27" fill="#ededed" font-weight="500">5 email briefs</text>
  <text x="80" y="306" font-size="25" fill="#a1a1a1" >16 runs per approach</text>
  <text x="80" y="346" font-size="23" fill="#a1a1a1" >64 runs in total.</text>

  <text x="500" y="272" font-size="88" fill="#7ee2a8" font-weight="600" letter-spacing="-4">2.6×</text>
  <text x="500" y="330" font-size="27" fill="#ededed" >faster to pass</text>
  <text x="500" y="365" font-size="22" fill="#a1a1a1" >vs. React Email</text>

