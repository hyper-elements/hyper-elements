<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img" aria-labelledby="title description">
<title id="title">Hyper Elements: faster to a passing email</title>
<desc id="description">Hyper Elements: 35 seconds, 2,346 output tokens, 11 of 16 first-check passes. Hand-written HTML: 65 seconds, 5,676 output tokens, 4 of 16 first-check passes. React Email: 76 seconds, 5,745 output tokens, 5 of 16 first-check passes. Time and output tokens are medians. Five email briefs and 16 runs per approach; all 48 runs eventually passed. Claude Code with Claude Sonnet 5, November 6, 2026. Bars start at zero; time uses an 80-second scale and tokens a 6,000-token scale. Each square represents one run's first check.</desc>
<rect width="1800" height="1140" rx="24" fill="#0a0a0a"/>
