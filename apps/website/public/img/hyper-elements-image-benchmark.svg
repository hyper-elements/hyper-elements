  <text x="80" y="154" font-size="25" fill="#a1a1a1" >20 runs per approach</text>
  <text x="80" y="194" font-size="23" fill="#a1a1a1" >60 runs in total.</text>

  <text x="500" y="120" font-size="88" fill="#7ee2a8" font-weight="600" letter-spacing="-4">1.65×</text>
  <text x="500" y="178" font-size="27" fill="#ededed" >faster to pass</text>
  <text x="500" y="213" font-size="22" fill="#a1a1a1" >vs. Canvas 2D</text>

  <text x="930" y="120" font-size="88" fill="#7ee2a8" font-weight="600" letter-spacing="-4">1.8×</text>
  <text x="930" y="178" font-size="27" fill="#ededed" >fewer output tokens</text>
  <text x="930" y="213" font-size="22" fill="#a1a1a1" >vs. Canvas 2D</text>

  <text x="1360" y="120" font-size="88" fill="#7ee2a8" font-weight="600" letter-spacing="-4">17/20</text>
  <text x="1360" y="178" font-size="27" fill="#ededed" >passed on first check</text>
  <text x="1360" y="213" font-size="22" fill="#a1a1a1" >Hyper Elements</text>

