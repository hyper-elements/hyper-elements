<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="792" viewBox="0 0 1800 792" role="img" aria-labelledby="title description">
<title id="title">Hyper Elements image agent benchmark</title>
<desc id="description">Hyper Elements: 76 seconds, 5,096 output tokens, 17 of 20 first-check passes. Playwright: 91 seconds, 6,846 output tokens, 14 of 20 first-check passes. Canvas 2D: 125 seconds, 9,132 output tokens, 16 of 20 first-check passes. Time and output tokens are medians. Five image briefs and 20 runs per approach, four per brief, in an isolated batch; all 60 runs were valid and eventually passed. The within-brief speed comparison with Playwright was inconclusive (p = 0.35). Claude Code with Claude Sonnet 5, November 8, 2026. Bars start at zero; time uses a 140-second scale and tokens a 10,000-token scale. Each square represents one run's first check.</desc>
