  <text x="80" y="154" font-size="25" fill="#a1a1a1" >16 runs per approach</text>
  <text x="80" y="194" font-size="23" fill="#a1a1a1" >64 runs in total.</text>

  <text x="500" y="120" font-size="88" fill="#7ee2a8" font-weight="600" letter-spacing="-4">2.6×</text>
  <text x="500" y="178" font-size="27" fill="#ededed" >faster to pass</text>
  <text x="500" y="213" font-size="22" fill="#a1a1a1" >vs. React Email</text>

  <text x="930" y="120" font-size="88" fill="#7ee2a8" font-weight="600" letter-spacing="-4">3.4×</text>
