<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Window widths from 0 to 1000px. A 600px Email takes its phone styles up to 620px wide, its width plus 20px. A Page takes them up to 480px wide, or up to its own breakpoints.mobile.">
  <rect width="880" height="250" rx="12" fill="#0f172a"/>
  <text x="150" y="34" font-size="14" fill="#94a3b8">A window 0px wide</text>
  <text x="850" y="34" text-anchor="end" font-size="14" fill="#94a3b8">1000px wide</text>
  <text x="24" y="85" font-size="16" font-weight="700" fill="#f1f5f9">Email, 600px</text>
  <rect x="150" y="66" width="434" height="28" rx="6" fill="#2dd4bf" fill-opacity="0.85"/>
  <rect x="587" y="66" width="263" height="28" rx="6" fill="#334155"/>
  <text x="367" y="85" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">phone styles</text>
  <text x="717" y="85" text-anchor="middle" font-size="14.5" fill="#cbd5e1">desktop styles</text>
  <path d="M585.5 58 V102" stroke="#f1f5f9" stroke-width="2"/>
  <text x="585.5" y="120" text-anchor="middle" font-size="14" fill="#cbd5e1">620px: its width + 20px</text>
  <text x="24" y="179" font-size="16" font-weight="700" fill="#f1f5f9">Page</text>
  <rect x="150" y="160" width="336" height="28" rx="6" fill="#2dd4bf" fill-opacity="0.85"/>
  <rect x="489" y="160" width="361" height="28" rx="6" fill="#334155"/>
  <text x="318" y="179" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">phone styles</text>
  <text x="668" y="179" text-anchor="middle" font-size="14.5" fill="#cbd5e1">desktop styles</text>
  <path d="M487.5 152 V196" stroke="#f1f5f9" stroke-width="2"/>
  <text x="487.5" y="214" text-anchor="middle" font-size="14" fill="#cbd5e1">480px, or its breakpoints.mobile</text>
</svg>
