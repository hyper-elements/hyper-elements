name: Template request
description: Ask for a template, a kit or a category in templates/
labels: ["templates"]
body:
  - type: markdown
    attributes:
      value: |
        Templates are ready-made emails, pages, PDFs and images that take any brand. See what's there at
        https://hyperelements.dev/templates, and how to add one yourself in templates/CONTRIBUTING.md.
  - type: dropdown
    id: output
    attributes:
      label: Output
      description: What it makes.
      multiple: true
      options:
        - Email
        - Web page
        - PDF
        - Image
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: The job it does, from the list in templates/CONTRIBUTING.md (invoice, sign-in-code, event, social-post…), or a new one.
      placeholder: sign-in-code
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it's for
      description: What a reader of it gets or does, and what it has to show.
    validations:
      required: true
  - type: textarea
    id: look
    attributes:
      label: The look you have in mind
      description: Optional. A description, or a link to an example. Not a real company's brand.
