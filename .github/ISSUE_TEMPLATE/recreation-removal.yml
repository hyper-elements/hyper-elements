name: Remove a recreation
description: For a company to ask for a recreation of its email, page, document or image to be taken down
labels: ["templates", "recreation-removal"]
body:
  - type: markdown
    attributes:
      value: |
        The templates folder has recreations: rebuilds of something a company sent, made to show how Hyper Elements
        draws it. If one of them is your company's and you'd like it removed, tell us which and we'll take it down,
        with no discussion needed.
  - type: input
    id: company
    attributes:
      label: Company
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: The recreation
      description: Its page on hyperelements.dev/templates, or its kit's name.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
