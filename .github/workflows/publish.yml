          pnpm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/hyper-elements-lint-*.tgz)
          if tar -xOzf "$TARBALL" package/package.json | grep -Eq '@hyper-elements/(core|template-loader)(["/]|$)'; then
            echo "::error::the packed manifest names a private package (@hyper-elements/core or @hyper-elements/template-loader)"
            exit 1
          fi
          npm publish "$TARBALL" --access public --tag "$(node ../../scripts/release.mjs tag)"
        env:
          NPM_RELEASE_TAG: ${{ vars.NPM_RELEASE_TAG }}

      - name: Tag release
        run: |
          TAG="lint-v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin | awk '{print $2}' | grep -Fxq "refs/tags/$TAG"; then
            echo "Tag $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # Not marked latest: the repository's latest release stays Elements.
      - name: Create GitHub Release
        run: |
          TAG="lint-v${{ steps.version.outputs.version }}"
          PREVIOUS=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^lint-v[0-9]' | grep -vFx "$TAG" | sort -V | tail -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --title "@hyper-elements/lint ${{ steps.version.outputs.version }}" \
              --generate-notes \
              --latest=false \
              ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
