# Release & Publish
#
# Gated publish flow, one package at a time:
#   1. PR merged to main → triggers build & test
#   2. Each package publishes only when its code changed since its last
#      release tag (Elements: v*, migrate: migrate-v*, email-clients: email-clients-v*, cli: cli-v*,
#      lint: lint-v*)
#   3. A reviewer approves each publish in the Actions UI (environment gate)
#   4. The package is published to npm via trusted publishing (OIDC)
#
# Version: bumps from the highest version published at any tag (scripts/release.mjs), so a release held on
# next (the repository variable NPM_RELEASE_TAG) isn't numbered again; a re-attempt reuses its run's version.
# Defaults to patch. Add a `release:minor` or `release:major` PR label to
# override. Manual dispatch also supports bump selection. A version
# committed ahead of npm (a planned minor or major) wins over the bump.
#
# Auth: Uses npm trusted publishing (OIDC) — no NPM_TOKEN needed.
# The `npm-publish` environment must be configured in repo Settings →
# Environments with at least one required reviewer.
#
# npm trusted publishing must also be configured on npmjs.com, per package:
#   Package Settings → Publishing access → Add trusted publisher →
#     Repository:  hyper-elements/hyper-elements
#     Workflow:    publish.yml
#     Environment: npm-publish
# npm only offers this on a package that exists, so a new package's first
# version is published by hand, with its release tag (e.g. migrate-v0.1.0).

name: Release

# Jobs that publish ask for more (tags, npm's OIDC token); the rest only read.
permissions:
  contents: read

on:
  push:
    branches: [main]
    # The website (apps/), the agent benchmark (benchmark/) and Storybook aren't published: a merge that only changes
    # them has nothing to release.
    # Storybook's paths are also left out of the Elements check below; keep the two lists the same.
    paths-ignore:
      - 'apps/**'
      - 'benchmark/**'
      - '.github/workflows/deploy-storybook.yml'
      - 'packages/react/.storybook/**'
      - 'packages/react/src/stories/**'
      - 'packages/react/src/primitives/examples/**'
      - 'packages/react/scripts/storybook-*'
      - 'packages/**/*.stories.tsx'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - react
          - migrate
          - email-clients
          - cli
          - lint
        default: react
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # @hyper-elements/cli's tests run every case on Node and again with the CLI started on Bun.
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  changes:
    name: Detect package changes
    runs-on: ubuntu-latest
    outputs:
      elements: ${{ steps.detect.outputs.elements }}
      migrate: ${{ steps.detect.outputs.migrate }}
      email-clients: ${{ steps.detect.outputs.email-clients }}
      cli: ${{ steps.detect.outputs.cli }}
      lint: ${{ steps.detect.outputs.lint }}

    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compared with each package's last release tag, so a release that
      # failed or was rejected is retried on the next push. Fails open: a git
      # error counts as a change. A commit that doesn't descend from the last
      # release (an older run re-run) publishes nothing: it would ship older
      # code as the newest version.
      - name: Detect changes since each package's last release
        id: detect
        shell: bash
        # The ref goes in through the environment, never into the script's text.
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $REF."
            exit 1
          fi
          last() { git tag -l "$1" --sort=-v:refname | head -1; }
          for pattern in 'v*' 'migrate-v*' 'email-clients-v*' 'cli-v*' 'lint-v*'; do
            tag=$(last "$pattern")
            if [ -n "$tag" ] && ! git merge-base --is-ancestor "$tag" HEAD; then
              echo "::notice::$tag isn't an ancestor of this commit: nothing older than it is published."
            fi
          done
          descends() {
            local tag
            tag=$(last "$1")
            [ -z "$tag" ] || git merge-base --is-ancestor "$tag" HEAD
          }
          changed() {
            local tag
            tag=$(last "$1")
            shift
            [ -z "$tag" ] && { echo true; return; }
            git merge-base --is-ancestor "$tag" HEAD || { echo false; return; }
            git diff --quiet "$tag" HEAD -- "$@" && echo false || echo true
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ELEMENTS=$([ "${{ inputs.package }}" = "react" ] && descends 'v*' && echo true || echo false)
            MIGRATE=$([ "${{ inputs.package }}" = "migrate" ] && descends 'migrate-v*' && echo true || echo false)
            EMAIL_CLIENTS=$([ "${{ inputs.package }}" = "email-clients" ] && descends 'email-clients-v*' && echo true || echo false)
            CLI=$([ "${{ inputs.package }}" = "cli" ] && descends 'cli-v*' && echo true || echo false)
            LINT=$([ "${{ inputs.package }}" = "lint" ] && descends 'lint-v*' && echo true || echo false)
          else
            # Storybook (its config, stories and examples) isn't in the package: the same paths as paths-ignore above.
            ELEMENTS=$(changed 'v*' packages/react packages/internal/core pnpm-workspace.yaml \
              ':(exclude)packages/react/.storybook' ':(exclude)packages/react/src/stories' \
              ':(exclude)packages/react/src/primitives/examples' ':(exclude,glob)packages/react/scripts/storybook-*' \
              ':(exclude,glob)packages/**/*.stories.tsx')
            # Not Elements: migrate requires the Elements range committed in its package.json (the oldest
            # release the converter supports), not the newest, so an Elements release doesn't republish it.
            # packages/internal/template-loader is the template loader it shares with the CLI, bundled into both: a change to it alone
            # releases both.
            MIGRATE=$(changed 'migrate-v*' packages/migrate packages/internal/template-loader pnpm-workspace.yaml pnpm-lock.yaml)
            # The email client previews: their own code, runtime and fonts. Like migrate, they require the Elements range
            # committed in their package.json, so an Elements release doesn't republish them.
            EMAIL_CLIENTS=$(changed 'email-clients-v*' packages/email-clients pnpm-workspace.yaml pnpm-lock.yaml)
            # The command line: its own code and the template loader bundled into it. It loads the project's Elements
            # (within the range committed in its package.json), so an Elements release doesn't republish it either.
            CLI=$(changed 'cli-v*' packages/cli packages/internal/template-loader pnpm-workspace.yaml pnpm-lock.yaml)
            # The lint plugin: its own code. It reads the tree the project's Elements hands it (types only), within the
            # range committed in its package.json, so an Elements release doesn't republish it.
            LINT=$(changed 'lint-v*' packages/lint pnpm-workspace.yaml pnpm-lock.yaml)
          fi
          # The first version of a new package is published by hand (see above).
          if [ "$MIGRATE" = "true" ] && ! npm view @hyper-elements/migrate version >/dev/null 2>&1; then
            echo "::notice::@hyper-elements/migrate isn't on npm yet: publish its first version by hand, tag it migrate-v<version>, and add its trusted publisher."
            MIGRATE=false
          fi
          if [ "$EMAIL_CLIENTS" = "true" ] && ! npm view @hyper-elements/email-clients version >/dev/null 2>&1; then
            echo "::notice::@hyper-elements/email-clients isn't on npm yet: publish its first version by hand, tag it email-clients-v<version>, and add its trusted publisher."
            EMAIL_CLIENTS=false
          fi
          if [ "$CLI" = "true" ] && ! npm view @hyper-elements/cli version >/dev/null 2>&1; then
            echo "::notice::@hyper-elements/cli isn't on npm yet: publish its first version by hand, tag it cli-v<version>, and add its trusted publisher."
            CLI=false
          fi
          if [ "$LINT" = "true" ] && ! npm view @hyper-elements/lint version >/dev/null 2>&1; then
            echo "::notice::@hyper-elements/lint isn't on npm yet: publish its first version by hand, tag it lint-v<version>, and add its trusted publisher."
            LINT=false
          fi
          echo "elements=$ELEMENTS" >> $GITHUB_OUTPUT
          echo "migrate=$MIGRATE" >> $GITHUB_OUTPUT
          echo "email-clients=$EMAIL_CLIENTS" >> $GITHUB_OUTPUT
          echo "cli=$CLI" >> $GITHUB_OUTPUT
          echo "lint=$LINT" >> $GITHUB_OUTPUT
          echo "Elements changed: $ELEMENTS, migrate changed: $MIGRATE, email-clients changed: $EMAIL_CLIENTS, cli changed: $CLI, lint changed: $LINT"

  publish:
    name: Publish @hyper-elements/react
    needs: [build-and-test, changes]
    if: needs.changes.outputs.elements == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    concurrency:
      group: publish
      cancel-in-progress: false
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      pull-requests: read

    steps:
      # The commit this run built and tested, not whatever main is when the approval lands.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Checked again here, where publishes run one at a time: re-running an
      # older run's failed jobs reuses the `changes` job's result from before a
      # newer commit was published, and would ship older code as the newest version.
      - name: Check no newer commit was published
        shell: bash
        run: |
          git fetch --tags --force origin
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$TAG" ] && ! git merge-base --is-ancestor "$TAG" HEAD; then
            echo "::error::$TAG was published from a newer commit than this run's: nothing older than it is published."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      # setup-node with registry-url enables OIDC token exchange for npm publish.
      # Trusted publishing needs no NPM_TOKEN.
      - name: Setup Node.js 24 (with npm registry for OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Determine version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> $GITHUB_OUTPUT
          else
            # Check labels on the PR associated with this commit
            LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].labels[].name' 2>/dev/null || echo "")
            if echo "$LABELS" | grep -Fxq "release:major"; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif echo "$LABELS" | grep -Fxq "release:minor"; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The next version from the highest published at any tag (not latest: a held release is on next), or the committed
      # version where it's ahead. A re-attempt of a run whose npm publish succeeded gets that version back with
      # publish=false, and only finishes the tag and the release (scripts/release.mjs, tested by release.test.mjs).
      - name: Determine version
        id: version
        run: node scripts/release.mjs version @hyper-elements/react "${{ steps.bump.outputs.type }}" packages/react >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp the version and this run's id
        run: node scripts/release.mjs stamp packages/react "${{ steps.version.outputs.version }}"

      # Published @hyper-elements/migrate refuses an Elements outside its range (^0.4.0 holds 0.4.x only). A release
      # outside it (a minor, 0.5.0) must raise the range in packages/migrate/package.json in the same change, so
      # migrate publishes after it with the new range; otherwise every published migrate refuses the newest Elements.
      # Raising it drops the Elements before, so migrate's committed version takes a minor too (0.4 came with migrate
      # 0.3.0): as a patch, projects on the old Elements would get a migrate they can't install.
      - name: Check migrate supports this Elements
        working-directory: packages/react
        run: |
          RANGE=$(node -p "require('../migrate/package.json').peerDependencies['@hyper-elements/react']")
          VERSION="${{ steps.version.outputs.version }}"
          if node -e '
            const [range, version] = process.argv.slice(1);
            const base = /^\^(\d+)\.(\d+)\.(\d+)$/.exec(range);
            if (!base) process.exit(2);
            const [M, m, p] = base.slice(1).map(Number);
            const [x, y, z] = version.split("-")[0].split(".").map(Number);
            const sameLine = M > 0 ? x === M : x === 0 && y === m;
            const atLeast = x !== M ? x > M : y !== m ? y > m : z >= p;
            process.exit(sameLine && atLeast ? 0 : 1);
          ' "$RANGE" "$VERSION"; then
            echo "Elements $VERSION is inside @hyper-elements/migrate's range $RANGE"
          elif npm view @hyper-elements/migrate version >/dev/null 2>&1; then
            echo "::error::Elements $VERSION is outside @hyper-elements/migrate's Elements range ($RANGE): every published migrate would refuse it. Raise the range in packages/migrate/package.json in this change (the converter must support $VERSION), so migrate publishes after it."
            exit 1
          else
            echo "::notice::Elements $VERSION is outside migrate's range ($RANGE), and migrate isn't on npm yet."
          fi

      # The same for @hyper-elements/email-clients, which follows Elements' minor: a release outside its range (a new
      # minor) raises the range in packages/email-clients/package.json in the same change, and the extension publishes
      # a matching minor after it (checked against that minor's previews first: see the package's README).
      - name: Check email-clients supports this Elements
        working-directory: packages/react
        run: |
          RANGE=$(node -p "require('../email-clients/package.json').peerDependencies['@hyper-elements/react']")
          VERSION="${{ steps.version.outputs.version }}"
          if node -e '
            const [range, version] = process.argv.slice(1);
            const base = /^\^(\d+)\.(\d+)\.(\d+)$/.exec(range);
            if (!base) process.exit(2);
            const [M, m, p] = base.slice(1).map(Number);
            const [x, y, z] = version.split("-")[0].split(".").map(Number);
            const sameLine = M > 0 ? x === M : x === 0 && y === m;
            const atLeast = x !== M ? x > M : y !== m ? y > m : z >= p;
            process.exit(sameLine && atLeast ? 0 : 1);
          ' "$RANGE" "$VERSION"; then
            echo "Elements $VERSION is inside @hyper-elements/email-clients' range $RANGE"
          elif npm view @hyper-elements/email-clients version >/dev/null 2>&1; then
            echo "::error::Elements $VERSION is outside @hyper-elements/email-clients' Elements range ($RANGE): every published email-clients would refuse it. Raise the range in packages/email-clients/package.json in this change, so email-clients publishes a matching minor after it."
            exit 1
          else
            echo "::notice::Elements $VERSION is outside email-clients' range ($RANGE), and email-clients isn't on npm yet."
          fi

      - name: Pre-publish summary
        working-directory: packages/react
        run: |
          MAIN_SIZE=$(wc -c < dist/primitives.js | tr -d ' ')
          BUILDER_SIZE=$(wc -c < dist/builder.js | tr -d ' ')
          FILE_COUNT=$(find dist -type f | wc -l | tr -d ' ')

          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`@hyper-elements/react\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.current }} → ${{ steps.version.outputs.version }} (${{ steps.bump.outputs.type }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auth** | Trusted publishing (OIDC) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Main entry (ESM)** | ${MAIN_SIZE} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| **/builder (ESM)** | ${BUILDER_SIZE} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| **Files in dist** | ${FILE_COUNT} |" >> $GITHUB_STEP_SUMMARY

      # Two-step publish: pnpm pack resolves the workspace: protocol to real
      # version numbers, then npm publish handles OIDC trusted publishing.
      # npm publish alone does NOT understand workspace: and would ship a broken manifest.
      # No --provenance flag yet: the repository is public now, so it can be added.
      # The dist-tag is the repository variable NPM_RELEASE_TAG while a release is held (next), else latest.
      - name: Publish to npm (trusted publishing)
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/react
        run: |
          pnpm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/hyper-elements-react-*.tgz)
          npm publish "$TARBALL" --access public --tag "$(node ../../scripts/release.mjs tag)"
        env:
          NPM_RELEASE_TAG: ${{ vars.NPM_RELEASE_TAG }}

      - name: Tag release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin | awk '{print $2}' | grep -Fxq "refs/tags/$TAG"; then
            echo "Tag $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # Notes start at the previous Elements tag: migrate-v* tags don't match v*.
      - name: Create GitHub Release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PREVIOUS=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^v[0-9]' | grep -vFx "$TAG" | sort -V | tail -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-migrate:
    name: Publish @hyper-elements/migrate
    needs: [build-and-test, changes, publish]
    # After Elements (when it publishes too), so the Elements range migrate requires is on npm.
    if: >-
      !cancelled() &&
      needs.build-and-test.result == 'success' &&
      needs.changes.outputs.migrate == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-migrate
      cancel-in-progress: false
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      pull-requests: read

    steps:
      # The commit this run built and tested, not whatever main is when the approval lands.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Checked again here, where publishes run one at a time: re-running an
      # older run's failed jobs reuses the `changes` job's result from before a
      # newer commit was published, and would ship older code as the newest version.
      - name: Check no newer commit was published
        shell: bash
        run: |
          git fetch --tags --force origin
          TAG=$(git tag -l 'migrate-v*' --sort=-v:refname | head -1)
          if [ -n "$TAG" ] && ! git merge-base --is-ancestor "$TAG" HEAD; then
            echo "::error::$TAG was published from a newer commit than this run's: nothing older than it is published."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node.js 24 (with npm registry for OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Determine version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> $GITHUB_OUTPUT
          else
            LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].labels[].name' 2>/dev/null || echo "")
            if echo "$LABELS" | grep -Fxq "release:major"; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif echo "$LABELS" | grep -Fxq "release:minor"; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # As Elements: from the highest version published at any tag, and a re-attempt reuses what its run published.
      - name: Determine version
        id: version
        run: node scripts/release.mjs version @hyper-elements/migrate "${{ steps.bump.outputs.type }}" packages/migrate >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp the version and this run's id
        run: node scripts/release.mjs stamp packages/migrate "${{ steps.version.outputs.version }}"

      # Packing writes the Elements range committed in package.json
      # (`workspace:^0.2.0` → `^0.2.0`): the oldest Elements the converter
      # supports, raised in a commit when the converter needs a newer one. Not
      # the newest Elements, which would refuse projects a patch behind. A
      # release in that range must be on npm, or installs would fail.
      - name: Check the Elements range
        id: elements
        working-directory: packages/migrate
        run: |
          RANGE=$(node -p "require('./package.json').peerDependencies['@hyper-elements/react'].replace(/^workspace:/, '')")
          case "$RANGE" in ^[0-9]*) ;; *) echo "::error::migrate's Elements range must be a committed ^<version> (found $RANGE)"; exit 1 ;; esac
          echo "range=$RANGE" >> $GITHUB_OUTPUT
          for attempt in 1 2 3 4 5 6; do
            if [ -n "$(npm view "@hyper-elements/react@$RANGE" version 2>/dev/null)" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::@hyper-elements/react@$RANGE isn't on npm: release Elements first."
          exit 1

      - name: Pre-publish summary
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`@hyper-elements/migrate\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.current }} → ${{ steps.version.outputs.version }} (${{ steps.bump.outputs.type }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Elements range** | ${{ steps.elements.outputs.range }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY

